[project]
name = "presidio-fr"
version = "0.1.0"
description = "French PII recognizers for Microsoft Presidio: NIR, SIREN/SIRET, numéro fiscal, plaque SIV, passeport."
readme = "README.md"
license = "MIT"
authors = [{ name = "Hao Xiao" }]
requires-python = ">=3.10"
dependencies = [
    "presidio-analyzer>=2.2",
]
keywords = ["presidio", "pii", "rgpd", "gdpr", "france", "anonymization"]

[project.optional-dependencies]
eval = ["faker>=20"]

[dependency-groups]
dev = [
    "pytest>=8",
    "faker>=20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["presidio_fr"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
